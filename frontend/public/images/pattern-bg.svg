<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1" fill="rgba(255,255,255,0.3)" />
      <circle cx="15" cy="15" r="1" fill="rgba(255,255,255,0.3)" />
    </pattern>
    <pattern id="circuit" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 20 20 L 20 0" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <path d="M 30 0 L 30 30 L 50 30" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <path d="M 50 10 L 30 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <path d="M 10 30 L 10 50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <path d="M 0 40 L 40 40 L 40 50" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
      <circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.2)" />
      <circle cx="30" cy="10" r="2" fill="rgba(255,255,255,0.2)" />
      <circle cx="10" cy="30" r="2" fill="rgba(255,255,255,0.2)" />
      <circle cx="40" cy="40" r="2" fill="rgba(255,255,255,0.2)" />
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#grid)" />
  <rect width="100" height="100" fill="url(#dots)" />
  <rect width="100" height="100" fill="url(#circuit)" />
</svg> 